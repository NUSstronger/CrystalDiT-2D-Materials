# DFCA DFT Environment Specification
# Purpose: GPAW DFT validation
# Generated: 2026-10-01

name: dfca-dft
channels:
  - conda-forge
  - defaults
dependencies:
  # Python core
  - python=3.10
  - pip>=23.0

  # GPAW (DFT calculator)
  - gpaw>=24.6
  - ase>=3.22

  # Phonon calculations
  - phonopy>=2.18
  - seekpath>=2.1

  # Scientific computing
  - numpy>=1.24
  - scipy>=1.10
  - matplotlib>=3.7
  - h5py>=3.8

  # Parallel computing
  - mpi4py>=3.1
  - openmpi>=4.1

  # Materials Project API
  - pip:
    - pymatgen>=2023
    - monty>=2023
    - emmet-core>=0.60

  # Testing
  - pytest>=7.0
  - pytest-cov

variables:
  # MPI settings
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  MPIRUN_DISABLE_SHEBANGS: "1"

  # GPAW settings
  GPAW_POOL_SIZE: "32"
  GPAW_GPU: "cuda"  # or "cpu"

export:
  # Limit threading for MPI
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
