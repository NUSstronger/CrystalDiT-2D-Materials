# DFCA HPC Environment Specification
# Purpose: Multi-node GPU cluster computing
# Generated: 2026-10-01

name: dfca-hpc
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  # Python core
  - python=3.10
  - pip>=23.0

  # PyTorch with CUDA
  - pytorch::pytorch>=2.0
  - torchvision
  - cuda-toolkit>=11.8

  # Scientific computing
  - numpy>=1.24
  - scipy>=1.10
  - pandas>=2.0
  - matplotlib>=3.7

  # Materials science
  - pymatgen>=2023
  - monty>=2023
  - spglib
  - sympy

  # Parallel computing
  - mpi4py>=3.1
  - openmpi>=4.1

  # Data processing
  - h5py>=3.8
  - pyyaml>=6.0
  - tqdm>=4.65

  # HPC job scheduling
  - psutil

  # DFT (optional, for validation)
  - gpaw>=24.6
  - ase>=3.22
  - phonopy>=2.18

  # ML potentials
  - pip:
    - mace-torch>=0.3
    - e3nn>=0.5
    - timm  # DiT architecture components (PatchEmbed, Attention, Mlp)

variables:
  # PyTorch
  PYTORCH_CUDA_ALLOC_CONF: "max_split_size_mb:512"
  CUDA_LAUNCH_BLOCKING: "0"

  # MPI
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  I_MPI_PIN: "1"

  # Slurm (if applicable)
  SLURM_JOB_ID: "${SLURM_JOB_ID:-}"
  SLURM_NTASKS: "${SLURM_NTASKS:-1}"
  SLURM_NODELIST: "${SLURM_NODELIST:-localhost}"
