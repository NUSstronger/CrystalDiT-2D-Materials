# ML Screening Configuration
# Extracted from: dfca/screening/config.py (ScreeningConfig dataclass)
#
# Purpose: Configure the ML-based screening pipeline for generated crystal candidates.
# All threshold values are calibrated to C2DB standards.
# DO NOT modify scientific values without version bump.
#
# Usage:
#   PYTHONPATH=. python -c "
#   from dfca.screening import ScreeningPipeline
#   from dfca.config import load_config
#
#   cfg = load_config('configs/screening.yaml')
#   pipeline = ScreeningPipeline(cfg)
#   pipeline.run()
#   "

# =============================================================================
# INPUT/OUTPUT
# =============================================================================
input_dir: ./generated_crystals
output_dir: ./dft_ready
train_csv: ""                               # Empty = skip novelty filtering

# =============================================================================
# DEVICE & ML MODEL
# =============================================================================
device: cpu                                 # cpu or cuda
mace_model: medium                          # small, medium, large

# =============================================================================
# S0: COMPOSITION FILTER
# =============================================================================
composition:
  valid_elements:                           # Common 2D materials elements
    - C
    - H
    - N
    - O
    - F
    - Si
    - P
    - S
    - Cl
    - Br

# =============================================================================
# S1: GEOMETRY CHECK
# =============================================================================
geometry:
  vacuum_min_angstrom: 5.0                  # Minimum vacuum gap (Å)
  slab_thickness_max: 15.0                  # Maximum slab thickness (Å)
  min_bond_distance: 0.4                    # Minimum allowed bond distance (Å)
  lattice_ab_min: 1.0                       # Minimum lattice a/b parameter (Å)
  lattice_ab_max: 50.0                      # Maximum lattice a/b parameter (Å)

# =============================================================================
# S2: SYMMETRY CHECK
# =============================================================================
symmetry:
  # StructureMatcher tolerances (pymatgen)
  ltol: 0.30                                # Lattice tolerance
  stol: 0.30                                # Structure tolerance
  angle_tol: 10.0                           # Angle tolerance (degrees)

  # Symmetry detection
  symprec: 0.1                              # Symmetry precision (Å)

# =============================================================================
# S3: DEDUPLICATION
# =============================================================================
deduplication:
  structure_similarity_tolerance: 0.02      # Ewald sum tolerance
  max_lat_diff: 0.5                         # Lattice difference (Å)
  max_pos_diff: 0.3                         # Position difference (Å)

# =============================================================================
# S3.5: ML RELAXATION
# =============================================================================
relaxation:
  relax_fmax: 0.05                          # Maximum force (eV/Å)
  relax_steps: 400                          # Maximum optimization steps
  relax_steps_retry: 800                    # Steps for retry relaxation
  fix_z_lattice: true                       # Fix c-axis during relaxation

# =============================================================================
# S4: ELASTIC MATRIX
# =============================================================================
elastic:
  elastic_delta: 0.005                      # Strain amplitude for finite difference

# =============================================================================
# S5: PHONON STABILITY
# =============================================================================
phonon:
  skip_phonon: false                        # Skip phonon check
  supercell: [3, 3, 1]                      # Supercell dimensions
  displacement: 0.03                        # Atomic displacement (Å)
  mesh: [20, 20, 1]                         # q-point mesh
  imaginary_freq_tol: -0.02                 # Tolerance (THz), C2DB Sec. 2.7

# =============================================================================
# S5': CONVEX HULL (Thermodynamic Stability)
# =============================================================================
ehull:
  threshold_ml: 0.2                         # E_hull threshold (eV/atom)
  enable_hard_gate: false                   # C2DB default: False
  mp_api_key: ""                            # Materials Project API key

# =============================================================================
# S7: MOLECULAR DYNAMICS (Optional per C2DB)
# =============================================================================
md:
  enable_md: false                          # Optional per C2DB
  temperature: 300.0                        # Temperature (K)
  dt_fs: 1.0                                # Timestep (fs)
  s7a_steps: 3000                           # Short MD steps (3ps)
  s7b_steps: 10000                          # Long MD steps (10ps)

# =============================================================================
# PIPELINE OPTIONS
# =============================================================================
pipeline:
  reject_p1: false                          # Reject primitive cell structures
  verbose: true                             # Enable detailed logging
  export_mag_buckets: true                  # Group by magnetic configuration
  save_interval: 10                         # Checkpoint interval (structures)
  vasp_vacuum_angstrom: 20.0                # Vacuum for VASP POSCAR export (Å)

  # Pareto analysis
  pareto_plot: false                        # Generate Pareto front plots
  pareto_plot_top_n: 10                     # Top N clusters for plotting

  # Reference energies (eV/atom) - can be empty to use MACE defaults
  reference_energies: {}

# =============================================================================
# V3.2 PHASE 2 OPTIONS
# =============================================================================
phase2:
  rerun_phase2: false                       # Reuse Phase 1 data
  force_rerun_all: false                    # Force rerun all records
