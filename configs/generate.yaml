# Generation Configuration for CrystalDiT
# Extracted from: scripts/generate.py, dfca/generation/generator.py
#
# Purpose: Generation reproducibility - these parameters control sample generation.
# DO NOT modify scientific values without version bump.
#
# Usage:
#   PYTHONPATH=. python scripts/generate.py --config configs/generate.yaml \
#       --checkpoint ./output/best_checkpoint.pt --num_samples 100

# =============================================================================
# MODEL CHECKPOINT & ARCHITECTURE
# =============================================================================
model:
  checkpoint: null                          # Required: specify via --checkpoint argument
  hidden_size: 512
  depth: 18
  num_heads: 8
  max_length: 46.7425                       # MAX_LATTICE_LENGTH normalization constant

# =============================================================================
# DATA & ELEMENT CONFIGURATION
# =============================================================================
data:
  data_dir: ./Data                          # Dataset for element filtering
  max_atoms: 20                             # Atom capacity per structure
  filter_rare_gases: true                   # Exclude He, Ne, Ar, etc.
  disable_dataset_element_filter: false     # Restrict to training-set elements

# =============================================================================
# DIFFUSION SAMPLING
# =============================================================================
diffusion:
  steps: 1000                               # DDPM sampling steps (must match training)
  z_noise_scale: 0.113001                   # Must match training (from checkpoint)
  lattice_c_noise_scale: 0.340659           # Must match training (from checkpoint)

# =============================================================================
# GENERATION BATCH & OUTPUT
# =============================================================================
generation:
  num_samples: 1000                         # Total structures to generate
  batch_size: 32                            # Per-device batch size
  output_dir: ./generated_crystals          # CIF output directory
  device: cuda                              # cuda or cpu

# =============================================================================
# DECODING PARAMETERS
# =============================================================================
decoding:
  # Element decoding
  element_sigma: 0.05                       # Gaussian width for row/col decoding
  min_valid_element_prob: 0.001             # Minimum element probability threshold

  # Coordinate validation
  coord_tolerance: 0.05                     # Allow coordinate overflow before rejection

  # Slab geometry filtering
  slab_center: 0.5                          # Expected fractional z-center
  slab_half_width: 0.15                     # Accept atoms within this z-distance

# =============================================================================
# 2D LATTICE PROJECTION
# =============================================================================
lattice_projection:
  enabled: true                             # Project lattice to 2D-friendly form
  min_c_length: 18.0                        # Minimum c-axis (Å)
  max_c_length: 35.0                        # Maximum c-axis (Å)
  gamma_min_deg: 60.0                       # Minimum in-plane angle (degrees)
  gamma_max_deg: 120.0                      # Maximum in-plane angle (degrees)

# =============================================================================
# ELEMENT DIVERSITY & FORBIDDEN ELEMENTS
# =============================================================================
elements:
  max_unique_elements: 4                    # Maximum element types per structure
  forbid_atomic_numbers:                    # Atomic numbers excluded from generation
    - 84   # Po
    - 85   # At
    - 86   # Rn
    - 87   # Fr
    - 88   # Ra
    - 89   # Ac
    - 90   # Th
    - 91   # Pa
    - 92   # U
    - 93   # Np
    - 94   # Pu

# =============================================================================
# TOP-K DECODER
# =============================================================================
topk_decoder:
  enabled: false                            # Use atom_count prior filtering
  split: train                              # Dataset split for atom_count prior
  seed: 20260504                            # Base seed for sampling atom counts

  # Penalties for constraint violations
  coord_oor_penalty: 100.0                  # Out-of-range coordinate penalty
  slab_penalty: 10.0                        # Slab boundary violation penalty

# =============================================================================
# POSTPROCESSING CONTROL
# =============================================================================
postprocessing:
  disable_all: false                        # Set true to disable all filtering

# =============================================================================
# MULTI-GPU
# =============================================================================
distributed:
  use_multi_gpu: false                      # Enable multi-GPU generation
  backend: nccl
