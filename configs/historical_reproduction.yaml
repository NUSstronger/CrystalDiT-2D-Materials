# Historical Reproduction Configuration
# ========================================
# This configuration reproduces the original screening parameters
# that were used in the publication experiments.
#
# NOTE: relax_steps_retry was NOT explicitly established by the
# original command line - it uses the C2DB standard default (800).
# All other values match the original screening run.

# =============================================================================
# DEVICE & ML MODEL
# =============================================================================
device: cpu
mace_model: medium                          # Server-verified working model

# =============================================================================
# S1: GEOMETRY CHECK
# =============================================================================
geometry:
  vacuum_min_angstrom: 8.0                  # Original: 8.0 Angstrom
  slab_thickness_max: 8.0                   # Original: 8.0 Angstrom
  min_bond_distance: 0.4
  lattice_ab_min: 1.0
  lattice_ab_max: 50.0

# =============================================================================
# S2: SYMMETRY CHECK
# =============================================================================
symmetry:
  ltol: 0.30
  stol: 0.30
  angle_tol: 10.0
  symprec: 0.1

# =============================================================================
# S3: DEDUPLICATION
# =============================================================================
deduplication:
  structure_similarity_tolerance: 0.02
  max_lat_diff: 0.5
  max_pos_diff: 0.3

# =============================================================================
# S3.5: ML RELAXATION
# =============================================================================
relaxation:
  relax_fmax: 0.05                          # Original: 0.05 eV/A
  relax_steps: 200                          # Original: 200 steps
  # relax_steps_retry: 800                  # NOT explicitly established
  fix_z_lattice: true

# =============================================================================
# S4: ELASTIC MATRIX
# =============================================================================
elastic:
  elastic_delta: 0.005                      # Original: 0.005

# =============================================================================
# S5: PHONON STABILITY
# =============================================================================
phonon:
  skip_phonon: false
  supercell: [3, 3, 1]                      # Original: [3,3,1]
  displacement: 0.03                        # Original: 0.03 Angstrom
  mesh: [20, 20, 1]
  imaginary_freq_tol: -0.02                 # Original: -0.02 THz

# =============================================================================
# S5': CONVEX HULL
# =============================================================================
ehull:
  threshold_ml: 0.2                         # Original: 0.2 eV/atom
  enable_hard_gate: false
  mp_api_key: ""                            # Use --mp_api_key CLI or env MP_API_KEY

# =============================================================================
# S7: MOLECULAR DYNAMICS
# =============================================================================
md:
  enable_md: false
  temperature: 300
  dt_fs: 1.0
  s7a_steps: 500                            # Original: 500 steps
  s7b_steps: 1000                           # Original: 1000 steps

# =============================================================================
# PIPELINE OPTIONS
# =============================================================================
pipeline:
  reject_p1: false
  verbose: true
  export_mag_buckets: false                 # Original: false
  save_interval: 10
  vasp_vacuum_angstrom: 20.0
  pareto_plot: false
  pareto_plot_top_n: 10
  reference_energies: {}

# =============================================================================
# PHASE 2 OPTIONS
# =============================================================================
phase2:
  rerun_phase2: false
  force_rerun_all: false
